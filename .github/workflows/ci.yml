name: titanic

on:
    push:
        branches: [BreadKrum-patch-1]
    workflow_dispatch:
            
jobs:
    build:
        runs-on : ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Set up Python 3.10
              uses: actions/setup-python@v4
              with:
                  python-version: '3.10'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run flake8 linting on src/ and api/
              run: flake8 src api || true

            - name: Run pytest
              run: pytest -q || true

            - name: setup docker buildx
              uses: docker/setup-buildx-action@v2

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/titanic:latest

    deploy:
        runs-on: self-hosted
        steps:
            - name: Pull Docker image
              run: docker pull ${{ secrets.DOCKER_USERNAME }}/titanic:latest

            - name: restart container
              run: |
                  docker stop titanic || true
                  docker rm titanic || true
                  docker run -d --name titanic -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/titanic:latest
